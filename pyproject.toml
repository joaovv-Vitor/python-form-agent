[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "form-agent-poc-python"
version = "0.1.0"
description = "PoC multiagente para transcrição de áudio e preenchimento seguro de formulários"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.1,<3",
  "openai>=1.99,<3",
  "phonenumbers>=9,<10",
  "playwright>=1.58,<2",
  "python-dotenv>=1.1,<2",
  "text2num>=3.1,<4",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
audio-agent-py = "audio_agent.cli:main"
audio-evaluate-py = "voice_form.evaluation:audio_main"
pipeline-evaluate-py = "voice_form.evaluation:main"
voice-form-agent-py = "voice_form.cli:main"
form-agent-py = "form_agent.cli:main"
form-evaluate-py = "form_agent.evaluation.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"form_agent.prompts" = ["*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["audio_agent*", "form_agent*", "voice_form*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that require external runtime dependencies",
  "whisper_integration: tests that load a local faster-whisper model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/audio_agent", "src/form_agent", "src/voice_form"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
