<text class="small" x="360" y="616" text-anchor="middle">AudioFormPipeline: áudio → transcrição → FormAgent</text>
<text class="small" x="1230" y="616" text-anchor="middle">Releitura pelo FormAgent; confirmação na CLI com “ENVIAR”.</text>
<text class="small" x="1230" y="646" text-anchor="middle">Envio condicionado à verificação e à autorização externa.</text>
</svg>