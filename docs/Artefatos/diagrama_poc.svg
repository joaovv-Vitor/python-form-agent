<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura da POC de preenchimento de formulários por texto e áudio</title>
<desc id="desc">Texto ou áudio transcrito alimenta o FormAgent, que consulta um modelo de linguagem e usa um cliente MCP por JSON-RPC em stdio para chamar o servidor local e o controlador Playwright. Os valores são relidos pelo FormAgent e apresentados para revisão humana. A autorização de envio é externa ao modelo e enviada pelo host ao MCP.</desc>
